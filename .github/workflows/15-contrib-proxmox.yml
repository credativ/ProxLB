name: Proxmox LXC + GUI plugin

on:
  push:
    paths:
      - 'contrib/proxmox/**'
      - 'tests/test_contrib_proxmox_agent.py'
      - '.github/workflows/15-contrib-proxmox.yml'
  pull_request:
    paths:
      - 'contrib/proxmox/**'
      - 'tests/test_contrib_proxmox_agent.py'
      - '.github/workflows/15-contrib-proxmox.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck + bash -n
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          for f in contrib/proxmox/proxlb-lxc.sh contrib/proxmox/proxlb-external.sh contrib/proxmox/gui/install-gui.sh \
                   contrib/proxmox/agent/install-agent.sh contrib/proxmox/gui/preview/make-screenshot.sh \
                   contrib/proxmox/agent/proxlb-ctl; do
            bash -n "$f"
          done
          shellcheck -S warning contrib/proxmox/proxlb-lxc.sh contrib/proxmox/proxlb-external.sh \
            contrib/proxmox/gui/install-gui.sh contrib/proxmox/agent/install-agent.sh \
            contrib/proxmox/gui/preview/make-screenshot.sh contrib/proxmox/agent/proxlb-ctl

  agent:
    name: Agent tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']   # Debian 12 / Debian 13 containers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ProxLB + test deps
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install . 'pytest<9'
      - name: Run agent tests
        run: ./.venv/bin/python -m pytest -v tests/test_contrib_proxmox_agent.py

  gui:
    name: GUI plugin tests + screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Syntax check + unit tests
        run: |
          node --check contrib/proxmox/gui/proxlb-gui.js
          node --test contrib/proxmox/gui/tests/plugin.test.js
      - name: Render the plugin on real ExtJS (fails on any page error)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          bash contrib/proxmox/gui/preview/make-screenshot.sh
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: proxlb-gui-screenshots
          path: docs/images/proxlb-gui*.png

  external:
    name: ProxLB on another machine (e2e, Debian ${{ matrix.debian }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]   # Python 3.11 / 3.13 (strict X.509 checks)
    steps:
      - uses: actions/checkout@v7
      - name: install-agent.sh + agent against a mock Proxmox API over verified TLS
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:${{ matrix.debian }} \
            bash -c 'cp -r /src /tmp/repo && bash /tmp/repo/contrib/proxmox/packaging/test-external.sh'
      - name: proxlb-external --ct (automatic connect of an LXC) with stubbed Proxmox commands
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:${{ matrix.debian }} \
            bash -c 'cp -r /src /tmp/repo && bash /tmp/repo/contrib/proxmox/packaging/test-external-ct.sh'
      - name: proxlb-lxc --enable-ha (rbd, ZFS replication, local storage) with stubbed Proxmox commands
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:${{ matrix.debian }} \
            bash -c 'cp -r /src /tmp/repo && bash /tmp/repo/contrib/proxmox/packaging/test-enable-ha.sh'

  bundle:
    name: Installer bundle
    runs-on: ubuntu-latest
    needs: [shellcheck, agent, gui, external]
    steps:
      - uses: actions/checkout@v7
      - name: Build proxlb-proxmox.tar.gz
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=ProxLB/ -o dist/proxlb-proxmox.tar.gz HEAD
          sha256sum dist/proxlb-proxmox.tar.gz > dist/proxlb-proxmox.tar.gz.sha256
          echo "Install on a PVE node:  tar xzf proxlb-proxmox.tar.gz && bash ProxLB/contrib/proxmox/proxlb-lxc.sh" > dist/INSTALL.txt
      - uses: actions/upload-artifact@v7
        with:
          name: proxlb-proxmox-bundle
          path: dist/
